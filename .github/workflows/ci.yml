name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so a runner-image update cannot silently change the toolchain.
  XCODE_VERSION: '26.6'

jobs:
  # The package has no platform dependencies, so the whole suite runs on macOS
  # in seconds without booting a simulator.
  spm:
    name: SwiftPM (macOS)
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build (warnings as errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Run Tests
        run: swift test

  test:
    name: Tests on ${{ matrix.device }} ${{ matrix.os }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS Simulator
            device: iPhone 17
            os: "latest"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set Project Scheme
        run: echo "scheme=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Run Tests with Code Coverage
        run: |
          set -o pipefail && \
          xcodebuild \
            -scheme "${{ env.scheme }}" \
            -destination "platform=${{ matrix.platform }},name=${{ matrix.device }},OS=${{ matrix.os }}" \
            -enableCodeCoverage YES \
            -derivedDataPath ./DerivedData \
            -resultBundlePath ./TestResults.xcresult \
            test

      - name: Install xcresultparser
        run: brew install xcresultparser

      - name: Generate Coverage Report
        run: |
          mkdir -p ./coverage
          xcresultparser \
            --output-format cobertura \
            ./TestResults.xcresult > ./coverage/cobertura.xml

      - name: Convert Test Results to JUnit
        run: |
          xcresultparser \
            --output-format junit \
            ./TestResults.xcresult > ./test-results.xml

      - name: Upload Code Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ./coverage/cobertura.xml
          fail_ci_if_error: true

      - name: Upload Test Results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          slug: ${{ github.repository }}
          files: ./test-results.xml
          fail_ci_if_error: true

  test-minimum:
    # Package.swift declares iOS 17 as the deployment target. No GitHub-hosted
    # image ships an iOS 17 simulator alongside a Swift 6 Xcode (macos-15 ships
    # iOS 18+ runtimes only), so this lane uses macos-15 + Xcode 16.4 and
    # downloads the iOS 17.4 runtime — the same approach as APWebAuthentication.
    name: Tests on iOS 17.4 Simulator (minimum)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set Project Scheme
        run: echo "scheme=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Install iOS 17.4 Simulator Runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS 17.4"; then
            xcodebuild -downloadPlatform iOS -buildVersion 17.4
          fi
          xcrun simctl list runtimes

      - name: Create iOS 17.4 Simulator
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS") and r["version"].startswith("17.4")))')
          udid=$(xcrun simctl create "iPhone 15 (iOS 17.4)" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$runtime")
          echo "Created simulator $udid on $runtime"
          echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: Run Tests
        run: |
          set -o pipefail && \
          xcodebuild \
            -scheme "${{ env.scheme }}" \
            -destination "${{ env.destination }}" \
            -derivedDataPath ./DerivedData \
            test

  build-platforms:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [ tvOS, watchOS, visionOS ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set Project Scheme
        run: echo "scheme=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Build
        run: |
          set -o pipefail && \
          xcodebuild \
            -scheme "${{ env.scheme }}" \
            -destination "generic/platform=${{ matrix.platform }} Simulator" \
            -derivedDataPath ./DerivedData \
            build

  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        # 6.0 is the minimum (swift-tools-version:6.0).
        swift: [ "6.0", "6.4" ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Tests
        run: swift test

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run SwiftLint
        run: |
          swiftlint version
          swiftlint lint --strict --reporter github-actions-logging
